<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Desk — accès à l'application</title>
<meta http-equiv="refresh" content="1; url=./trading/">
<style>
  :root{--bg:#080a0e;--panel:#11151d;--line:rgba(255,255,255,.08);--text:#e9edf6;--muted:#8b93a7;--gold:#f2c14e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
    background:radial-gradient(900px 500px at 80% -10%,rgba(242,193,78,.08),transparent 60%),var(--bg);
    color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .box{max-width:560px;width:100%;background:linear-gradient(180deg,var(--panel),#0c0f15);
    border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center;
    box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
  .logo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--gold),#c8952c);color:#141005;font-size:30px;font-weight:800}
  h1{margin:0 0 6px;font-size:1.4rem}
  p{color:var(--muted);margin:.5em 0}
  a.btn{display:inline-block;margin-top:14px;padding:13px 22px;border-radius:12px;font-weight:700;
    background:linear-gradient(180deg,#f7d072,var(--gold));color:#191203;text-decoration:none}
  code{background:#1a2030;padding:2px 6px;border-radius:6px;font-size:.86em}
  .ok{color:#25d09a}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">◎</div>
    <h1>Trading Desk</h1>
    <p>Journal de trading, plan écrit et tableau de bord de performance.</p>
    <p class="ok">Redirection vers l'application…</p>
    <a class="btn" href="./trading/">Ouvrir l'application</a>
    <p style="font-size:.82rem;margin-top:18px">
      Si la page ne s'ouvre pas : <code>trading/index.html</code>
    </p>
  </div>
  <script>location.replace('./trading/');</script>
</body>
</html>
